name: Validate WordPress PDF Catalogue Flipbook Builder

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install conversion dependencies
        run: python -m pip install -r requirements.txt

      - name: Test conversion and packaging
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      # GitHub's Ubuntu 24.04 runner includes PHP 8.3. No third-party setup action.
      - name: Lint PHP
        run: |
          php --version
          find assets/wordpress-plugin-template tests -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

      - name: Test WordPress PHP contract
        run: php tests/test_wordpress_plugin.php

      - name: Check front-end JavaScript syntax
        run: |
          node --check assets/wordpress-plugin-template/assets/js/viewer.js
          node --check assets/wordpress-plugin-template/block/editor.js
          node --check scripts/patch_vendor.mjs

      - name: Verify pinned vendor and lifecycle regression
        run: |
          node scripts/patch_vendor.mjs --check
          node tests/test_vendor_lifecycle.mjs

      - name: Build fictional sample plugin
        run: >-
          python scripts/build_wordpress_flipbook.py
          --input examples/demo/pages
          --metadata examples/demo/metadata.json
          --catalogue-title "Field Notes - Sample Catalogue"
          --output dist/ci-demo

      - name: Validate the exact uploadable ZIP
        run: python scripts/validate_wordpress_package.py dist/ci-demo/wp-product-flipbook.zip

      - name: Verify source release allowlist
        run: python scripts/package_source.py --list-only

      # Exact filenames only: never upload an input folder, site backup, or all dist/.
      - name: Upload fictional demo plugin
        uses: actions/upload-artifact@v7
        with:
          name: fictional-wordpress-flipbook-demo
          path: |
            dist/ci-demo/wp-product-flipbook.zip
            dist/ci-demo/wp-product-flipbook.zip.sha256
            dist/ci-demo/wp-product-flipbook.build-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
